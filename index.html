<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b2430">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Trading Companion</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f6f4ef;
    --surface:#ffffff;
    --surface-dark:#1b2430;
    --text:#1b2430;
    --text-inverse:#f6f4ef;
    --line:#d8d3c6;
    --muted:#6b6458;
    --muted-on-dark:#9aa6ad;
    --input-bg:#f6f4ef;
    --accent:#1f7a4d;
    --accent2:#1f7a4d;
    --danger:#b23b3b;
    --good:#1f7a4d;
    --shadow:rgba(27,36,48,0.08);
    --good-on-dark:var(--good);
    --danger-on-dark:var(--danger);
  }
  body.theme-dark{
    color-scheme: dark;
    --bg:#10161d;
    --surface:#1a222b;
    --text:#e9e6de;
    --line:#2b3641;
    --muted:#9aa6ad;
    --muted-on-dark:#8b939b;
    --input-bg:#222b35;
    --accent:#3ecf8e;
    --accent2:#3ecf8e;
    --danger:#e2685f;
    --good:#3ecf8e;
    --shadow:rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: system-ui, -apple-system, Roboto, "Segoe UI", Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color: transparent;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:620px;margin:0 auto;padding:0 16px 100px;}
  header{
    position:fixed;top:0;left:0;right:0;z-index:95;
    background:var(--bg);
    padding:18px 16px 14px;
    border-bottom:1px solid var(--line);
    max-width:620px;margin:0 auto;
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  }
  .header-spacer{height:108px;}
  .header-text{flex:1;min-width:0;}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em;font-weight:700;}
  .sub{color:var(--muted);font-size:13px;margin:0;}

  .theme-toggle{
    flex-shrink:0;width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line);background:var(--surface);color:var(--text);
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    margin-top:2px;
  }

  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:100;
    display:flex;background:var(--surface);border-top:1px solid var(--line);
    box-shadow:0 -2px 10px var(--shadow);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .tabs button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:10px 6px 8px;border:none;font-family:inherit;font-size:11px;cursor:pointer;
    background:var(--surface);color:var(--muted);position:relative;
    transition:color .25s ease;
  }
  .tabs button .tab-icon{width:21px;height:21px;line-height:1;transition:color .25s ease;}
  .tabs button .tab-icon svg{width:100%;height:100%;display:block;}
  .tabs button.active{color:var(--accent2);}
  .tab-indicator{
    position:absolute;top:0;height:2.5px;background:var(--accent2);
    transition:left .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
  }

  .view-fade{animation:viewFadeIn .22s ease;}
  @keyframes viewFadeIn{
    from{opacity:0;transform:translateY(4px);}
    to{opacity:1;transform:translateY(0);}
  }

  .panel{background:var(--surface);border:1px solid var(--line);padding:20px;margin-bottom:16px;}
  .panel.dark{background:var(--surface);color:var(--text);}
  .panel h2{
    font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:8px;
  }
  .panel.dark h2{color:var(--muted);border-bottom-color:var(--line);}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field{margin-bottom:14px;}
  input[type=number], input[type=date], input[type=text], select, textarea{
    width:100%;padding:10px 12px;font-family:inherit;font-size:14px;
    border:1px solid var(--line);background:var(--input-bg);color:var(--text);
  }
  textarea{min-height:60px;resize:vertical;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent2);outline-offset:-1px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px;}
  .stat-val{font-size:18px;font-weight:600;}
  .big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:2px 0 2px;}
  .big span{font-size:15px;font-weight:400;color:var(--muted);}

  .toggle{display:flex;border:1px solid var(--line);overflow:hidden;}
  .toggle button{
    flex:1;padding:10px;background:var(--surface);border:none;font-family:inherit;font-size:13px;
    cursor:pointer;color:var(--muted);border-right:1px solid var(--line);
  }
  .toggle button:last-child{border-right:none;}
  .toggle button.active{background:var(--accent2);color:#fff;}

  .risk-row{display:flex;gap:8px;}
  .risk-row button{
    flex:1;padding:8px;border:1px solid var(--line);background:var(--surface);font-family:inherit;
    cursor:pointer;font-size:13px;color:var(--muted);
  }
  .risk-row button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .warn{margin-top:14px;padding:10px 12px;background:#3a2020;border-left:3px solid var(--danger);font-size:12.5px;color:#f0d8d8;display:none;}
  .warn.show{display:block;}

  .btn-primary{
    display:inline-flex;align-items:center;gap:6px;background:var(--accent2);color:#fff;border:none;
    padding:10px 16px;font-family:inherit;font-size:13px;cursor:pointer;
  }
  .btn-ghost{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted);
    padding:8px 14px;font-family:inherit;font-size:12px;cursor:pointer;
  }

  .cb-row{
    display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line);
    font-size:14px;cursor:pointer;
  }
  .cb-row input{margin-top:3px;flex-shrink:0;width:16px;height:16px;accent-color:var(--accent2);}
  .cb-row.checked span{color:var(--muted);text-decoration:line-through;}

  .success-box{background:var(--good);color:#fff;padding:14px 16px;font-size:13.5px;font-weight:600;}
  .lock-notice{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--danger);}

  .entry-card{border:1px solid var(--line);padding:12px;margin-bottom:10px;position:relative;}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .entry-title{font-size:14px;font-weight:600;}
  .entry-meta{font-size:12px;color:var(--muted);margin-top:4px;}
  .entry-note{font-size:12px;margin-top:6px;color:var(--text);white-space:pre-line;line-height:1.5;}
  .entry-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--accent2);margin-top:6px;text-decoration:underline;font-weight:500;}
  .entry-result{font-size:13px;font-weight:700;text-align:right;}
  .entry-del{background:none;border:none;cursor:pointer;color:var(--muted);margin-top:6px;font-size:12px;display:block;}
  .entry-edit{background:none;border:none;cursor:pointer;color:var(--accent2);margin-top:6px;font-size:12px;display:block;}

  .note-text{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.5;}
  .footer-line{border-top:1px solid var(--line);margin-top:24px;padding-top:14px;font-size:11px;color:var(--muted);}

  ::placeholder{color:var(--muted);opacity:0.7;}

  .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap;}
  .btn-danger-ghost{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--danger);color:var(--danger);
    padding:8px 14px;font-family:inherit;font-size:12px;cursor:pointer;
  }

  .fab{
    position:fixed;right:18px;bottom:82px;z-index:90;
    display:flex;align-items:center;justify-content:center;
    width:52px;height:52px;border-radius:50%;
    background:var(--accent2);color:#fff;border:none;
    box-shadow:0 4px 12px rgba(27,36,48,0.28);
    font-size:20px;cursor:pointer;
  }
  .fab:active{transform:scale(0.94);}
  .fab-danger{background:var(--danger);}
  .tabs, .fab { transition: bottom .15s ease; }


  @media print {
    body.theme-dark{
      --bg:#f6f4ef !important; --surface:#ffffff !important; --text:#1b2430 !important;
      --line:#d8d3c6 !important; --muted:#6b6458 !important; --muted-on-dark:#9aa6ad !important;
      --accent:#1f7a4d !important; --accent2:#1f7a4d !important; --danger:#b23b3b !important; --good:#1f7a4d !important;
    }
    header{ position:static !important; }
    .header-spacer{ display:none !important; }
    .fab, .theme-toggle{ display:none !important; }
    .tabs, .btn-ghost, .btn-danger-ghost, .entry-del, .entry-edit, .footer-line, #journal-form-panel, .lock-notice { display:none !important; }
    body.print-journal #view-checklist, body.print-journal #view-calculator, body.print-journal #view-journal { display:none !important; }
    body.print-journal #view-statistik { display:block !important; }
    body{background:#fff;}
    .wrap{max-width:100%;padding:0;}
    .panel{break-inside:avoid;border:1px solid #999;}
    .panel.dark{background:#fff !important;color:#000 !important;}
    .panel.dark h2{color:#333 !important;border-bottom-color:#ccc !important;}
    .panel.dark .stat-label{color:#555 !important;}
    .panel.dark .big, .panel.dark .stat-val{color:#000 !important;}
    .cb-row{cursor:default;}
    .success-box{background:#fff !important;color:#000 !important;border:1px solid #2f6d47;}
    .entry-link{color:#1f7a4d !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-text">
      <p class="eyebrow">Trading Companion</p>
      <h1 id="page-title">Statistik</h1>
      <p class="sub">Satu tempat untuk disiplin proses trading kamu.</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" title="Ganti tema Terang/Gelap">🌙</button>
  </header>
  <div class="header-spacer"></div>

  <div id="view-statistik"></div>
  <div id="view-checklist" style="display:none;"></div>
  <div id="view-journal" style="display:none;"></div>
  <div id="view-calculator" style="display:none;"></div>

  <div class="footer-line">Alat bantu disiplin proses trading — bukan sinyal atau jaminan hasil. Data journal &amp; checklist tersimpan di perangkat kamu.</div>
</div>

<button class="fab fab-danger" id="fab-reset-checklist" title="Reset Checklist" style="display:none;">↺</button>
<button class="fab" id="fab-export-journal" title="Simpan Journal sebagai PDF" style="display:none;">⬇</button>

<div class="tabs">
  <button id="tab-statistik" class="active">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="20" x2="5" y2="12"></line>
        <line x1="12" y1="20" x2="12" y2="6"></line>
        <line x1="19" y1="20" x2="19" y2="15"></line>
      </svg>
    </span>Statistik
  </button>
  <button id="tab-checklist">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 6 6 8 9 4"></polyline>
        <line x1="6" y1="13" x2="20" y2="13"></line>
        <line x1="6" y1="17" x2="20" y2="17"></line>
        <line x1="6" y1="21" x2="20" y2="21"></line>
        <line x1="6" y1="9" x2="20" y2="9"></line>
      </svg>
    </span>Checklist
  </button>
  <button id="tab-journal">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path>
        <line x1="6" y1="3" x2="6" y2="21"></line>
        <line x1="9" y1="8" x2="14" y2="8"></line>
        <line x1="9" y1="12" x2="14" y2="12"></line>
      </svg>
    </span>Journal
  </button>
  <button id="tab-calculator">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2"></rect>
        <line x1="8" y1="6" x2="16" y2="6"></line>
        <line x1="7.5" y1="11" x2="7.5" y2="11.01"></line>
        <line x1="12" y1="11" x2="12" y2="11.01"></line>
        <line x1="16.5" y1="11" x2="16.5" y2="11.01"></line>
        <line x1="7.5" y1="15" x2="7.5" y2="15.01"></line>
        <line x1="12" y1="15" x2="12" y2="15.01"></line>
        <line x1="16.5" y1="15" x2="16.5" y2="15.01"></line>
        <line x1="7.5" y1="19" x2="7.5" y2="19.01"></line>
        <line x1="12" y1="19" x2="12" y2="19.01"></line>
        <line x1="16.5" y1="19" x2="16.5" y2="19.01"></line>
      </svg>
    </span>Kalkulator
  </button>
  <div class="tab-indicator" id="tab-indicator"></div>
</div>

<script>
/* ---------- DATA ---------- */
const ENTRY_ITEMS = [
  "Struktur market sudah jelas (HH-HL untuk uptrend / LH-LL untuk downtrend)?",
  "Sudah ada Impulsif Candle atau pergerakan signifikan (IFC/IMB)?",
  "Inside bar / area SnR atau SnD sudah ditentukan?",
  "Sudah terjadi retracement / retest ke area tersebut?",
  "Sudah ada konfirmasi (candle rejection / ChoCh & BoS)?",
  "RR minimal 1:1.5, maksimal 1:3?"
];

const RISK_SECTIONS = [
  { title: "Position Sizing", items: [
    "Risk per trade sudah dihitung, maksimal 1-2% dari modal?",
    "SL di titik invalidasi struktur, bukan asal RR bagus?"
  ]},
  { title: "Batasan Harian", items: [
    "Belum kena limit loss harian (3-5% modal)?",
    "Belum entry lebih dari 3x hari ini?"
  ]},
  { title: "Disiplin Eksekusi", items: [
    "SL sudah dipasang SAAT entry, bukan mental stop?",
    "Tidak averaging pada trade yang sedang loss?"
  ]},
  { title: "Evaluasi", items: [
    "Kalau loss beruntun 2-3x, siap berhenti sejenak?"
  ]}
];

// Pemetaan nilai default SL acuan awal
const DEFAULT_SL_MAP = {
  xauusd: { dollar: 5, pips: 50, points: 500 },
  btcusd: { dollar: 500, pips: 500, points: 5000 },
  forex: { dollar: 0.0030, pips: 30, points: 300 }
};

// Satuan SL terkunci otomatis per instrumen — tidak bisa dipilih manual,
// supaya tidak ada risiko salah pilih satuan yang berakibat fatal ke lot size.
const UNIT_MAP = {
  xauusd: "dollar",
  btcusd: "dollar",
  forex: "pips"
};

/* ---------- STORAGE HELPERS ---------- */
// Tanggal hari ini dalam zona waktu LOKAL perangkat (bukan UTC).
// toISOString() bawaan JS selalu pakai UTC, yang bisa bikin tanggal mundur
// 1 hari untuk WIB/WITA/WIT terutama dini hari sebelum jam 7 pagi.
function todayLocalISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error(e); }
}

/* ---------- TAB SWITCHING ---------- */
const tabs = ["statistik", "checklist", "journal", "calculator"];
let currentTab = "statistik";
const tabScrollPositions = { statistik: 0, checklist: 0, journal: 0, calculator: 0 };

const TAB_TITLES = {
  statistik: "Statistik",
  checklist: "Checklist",
  journal: "Journal",
  calculator: "Kalkulator"
};

function showTab(name) {
  // Simpan posisi scroll tab yang sedang ditinggalkan, sebelum pindah.
  if (currentTab) {
    tabScrollPositions[currentTab] = window.scrollY;
  }

  const titleEl = document.getElementById("page-title");
  if (titleEl) titleEl.textContent = TAB_TITLES[name] || "";

  currentTab = name;
  tabs.forEach(t => {
    const viewEl = document.getElementById("view-" + t);
    viewEl.style.display = (t === name) ? "block" : "none";
    document.getElementById("tab-" + t).classList.toggle("active", t === name);
  });
  document.getElementById("fab-export-journal").style.display = (name === "statistik") ? "flex" : "none";
  document.getElementById("fab-reset-checklist").style.display = (name === "checklist") ? "flex" : "none";

  if (name === "calculator") {
    renderCalculator();
  }
  if (name === "journal") {
    renderJournal();
  }
  if (name === "checklist") {
    renderChecklist();
  }
  if (name === "statistik") {
    renderStatistik();
  }

  // Animasi masuk halus untuk konten tab yang baru ditampilkan.
  const activeView = document.getElementById("view-" + name);
  if (activeView) {
    activeView.classList.remove("view-fade");
    void activeView.offsetWidth; // paksa reflow supaya animasi re-trigger tiap pindah tab
    activeView.classList.add("view-fade");
  }

  // Geser indikator garis aktif ke posisi tombol tab yang baru, dengan transisi halus.
  const activeBtn = document.getElementById("tab-" + name);
  const indicator = document.getElementById("tab-indicator");
  if (activeBtn && indicator) {
    indicator.style.left = activeBtn.offsetLeft + (activeBtn.offsetWidth / 2 - 14) + "px";
    indicator.style.width = "28px";
  }

  // Pulihkan posisi scroll tab yang baru dibuka (bukan ikut posisi tab sebelumnya).
  window.scrollTo(0, tabScrollPositions[name] || 0);
}
tabs.forEach(t => document.getElementById("tab-" + t).addEventListener("click", () => showTab(t)));

// Set posisi awal indikator begitu halaman selesai dimuat (sebelum showTab pertama sempat menghitung layout).
window.addEventListener("load", () => {
  const activeBtn = document.getElementById("tab-" + currentTab);
  const indicator = document.getElementById("tab-indicator");
  if (activeBtn && indicator) {
    indicator.style.left = activeBtn.offsetLeft + (activeBtn.offsetWidth / 2 - 14) + "px";
    indicator.style.width = "28px";
  }
});

document.getElementById("fab-export-journal").addEventListener("click", () => {
  exportToPDF("journal");
});
document.getElementById("fab-reset-checklist").addEventListener("click", () => {
  resetChecklist();
});

/* ---------- EXPORT PDF ---------- */
function exportToPDF(which) {
  document.body.classList.add("print-" + which);
  window.print();
}
window.addEventListener("afterprint", () => {
  document.body.classList.remove("print-checklist", "print-journal");
  showTab(currentTab);
});

/* ================= CHECKLIST ================= */
// Checklist SENGAJA tidak dimuat dari penyimpanan lama — selalu mulai kosong
// tiap kali aplikasi dibuka ulang (sesuai permintaan: reset otomatis saat
// pertama kali dibuka, supaya kamu wajib checklist ulang tiap sesi trading).
let entryChecks = Array(ENTRY_ITEMS.length).fill(false);
let riskChecks = RISK_SECTIONS.map(s => Array(s.items.length).fill(false));

function renderChecklist() {
  const el = document.getElementById("view-checklist");
  const entryDone = entryChecks.filter(Boolean).length;
  const entryComplete = entryDone === ENTRY_ITEMS.length;
  const riskTotal = RISK_SECTIONS.reduce((s, sec) => s + sec.items.length, 0);
  const riskDone = riskChecks.reduce((s, sec) => s + sec.filter(Boolean).length, 0);

  let html = "";

  html += `<div class="panel"><h2>I — Checklist Entry (${entryDone}/${ENTRY_ITEMS.length})</h2>`;
  ENTRY_ITEMS.forEach((item, i) => {
    html += `<label class="cb-row ${entryChecks[i] ? "checked" : ""}">
      <input type="checkbox" data-type="entry" data-idx="${i}" ${entryChecks[i] ? "checked" : ""}>
      <span>${item}</span>
    </label>`;
  });
  if (!entryComplete) {
    html += `<div class="lock-notice">⚠ Semua poin wajib dicentang sebelum lanjut ke risk management.</div>`;
  }
  html += `</div>`;

  if (entryComplete) {
    const ROMAN = ["II", "III", "IV", "V"];
    RISK_SECTIONS.forEach((section, sIdx) => {
      html += `<div class="panel"><h2>${ROMAN[sIdx]} — Risk Management: ${section.title}</h2>`;
      section.items.forEach((item, iIdx) => {
        const checked = riskChecks[sIdx][iIdx];
        html += `<label class="cb-row ${checked ? "checked" : ""}">
          <input type="checkbox" data-type="risk" data-section="${sIdx}" data-idx="${iIdx}" ${checked ? "checked" : ""}>
          <span>${item}</span>
        </label>`;
      });
      html += `</div>`;
    });

    if (riskDone === riskTotal) {
      html += `<div class="success-box">Semua checklist terpenuhi. Silakan lanjut ke kalkulator lot size untuk menentukan ukuran posisi.</div>`;
    }
  }

  html += `<p class="note-text">Checklist ini adalah kerangka awal, bukan jaminan profit. Uji lewat backtest dan forward test sebelum menaikkan risiko.</p>`;

  el.innerHTML = html;

  el.querySelectorAll('input[data-type="entry"]').forEach(cb => {
    cb.addEventListener("change", () => {
      const i = parseInt(cb.dataset.idx, 10);
      entryChecks[i] = !entryChecks[i];
      saveJSON("checklist-entry", entryChecks);
      renderChecklist();
    });
  });
  el.querySelectorAll('input[data-type="risk"]').forEach(cb => {
    cb.addEventListener("change", () => {
      const s = parseInt(cb.dataset.section, 10);
      const i = parseInt(cb.dataset.idx, 10);
      riskChecks[s][i] = !riskChecks[s][i];
      saveJSON("checklist-risk", riskChecks);
      renderChecklist();
    });
  });
}

function resetChecklist() {
  entryChecks = Array(ENTRY_ITEMS.length).fill(false);
  riskChecks = RISK_SECTIONS.map(s => Array(s.items.length).fill(false));
  saveJSON("checklist-entry", entryChecks);
  saveJSON("checklist-risk", riskChecks);
  renderChecklist();
}

/* ================= JOURNAL ================= */
let entries = loadJSON("journal-entries", []);
let editingId = null;
let saldoAwal = loadJSON("saldo-awal", 0);

// Satuan mata uang yang dipakai di seluruh tampilan nominal (Saldo, Ringkasan,
// Grafik, Riwayat, Kalkulator) — supaya kamu bisa menyesuaikan dengan satuan
// yang dipakai di akun trading kamu sendiri (Dollar/Cent).
const CURRENCY_SYMBOLS = { dollar: "$", cent: "¢" };
let currencyUnit = loadJSON("currency-unit", "dollar");
if (!CURRENCY_SYMBOLS[currencyUnit]) currencyUnit = "dollar";

function currencySymbol() {
  return CURRENCY_SYMBOLS[currencyUnit] || "$";
}

// Format nominal tanpa tanda + eksplisit (minus otomatis muncul dari angka negatif).
function formatMoney(value) {
  const v = parseFloat(value) || 0;
  const neg = v < 0;
  const absVal = Math.abs(v);
  const numStr = absVal.toFixed(2);
  return (neg ? "-" : "") + currencySymbol() + numStr;
}

// Sama seperti formatMoney, tapi selalu tampilkan tanda + di depan kalau positif
// (dipakai untuk P/L, rata-rata profit/loss, dsb).
function formatMoneySigned(value) {
  const v = parseFloat(value) || 0;
  const neg = v < 0;
  const absVal = Math.abs(v);
  const numStr = absVal.toFixed(2);
  return (neg ? "-" : "+") + currencySymbol() + numStr;
}
// Status peringatan checklist: false = tampilkan versi singkat saja,
// true = sudah pernah coba Simpan Trade saat belum lengkap -> tampilkan
// versi lengkap (daftar poin) dan tetap begitu sampai checklist lengkap lagi.
let checklistWarningExpanded = false;
let journalForm = {
  tanggal: todayLocalISO(),
  pair: "", arah: "buy", entry: "", sl: "", tp: "", lot: "",
  hasil: "profit", pl: "", link: "", catatan: ""
};

function isChecklistComplete() {
  const entryOk = entryChecks.every(Boolean);
  const riskOk = riskChecks.every(section => section.every(Boolean));
  return entryOk && riskOk;
}

// Kumpulkan teks semua poin checklist yang BELUM dicentang saat ini —
// dipakai untuk merekam jejak historis di journal saat trade disimpan.
function getMissingChecklistItems() {
  const missing = [];
  ENTRY_ITEMS.forEach((item, i) => {
    if (!entryChecks[i]) missing.push(item);
  });
  RISK_SECTIONS.forEach((section, sIdx) => {
    section.items.forEach((item, iIdx) => {
      if (!riskChecks[sIdx][iIdx]) missing.push(item);
    });
  });
  return missing;
}

// Bangun grafik equity curve (SVG murni, tanpa library eksternal supaya
// tetap ringan & jalan offline). Mengelompokkan P/L per tanggal, lalu
// menghitung saldo kumulatif dari Saldo Awal.
function buildEquityCurveSVG() {
  if (entries.length === 0) {
    return `<p style="font-size:13px;color:var(--muted);">Belum ada data trade untuk ditampilkan grafiknya.</p>`;
  }

  const byDate = {};
  entries.forEach(e => {
    const d = e.tanggal || "";
    if (!d) return;
    byDate[d] = (byDate[d] || 0) + (parseFloat(e.pl) || 0);
  });
  const dates = Object.keys(byDate).sort();

  let cum = saldoAwal;
  const points = [{ date: null, cum: saldoAwal, dailyPL: 0 }];
  dates.forEach(d => {
    cum += byDate[d];
    points.push({ date: d, cum, dailyPL: byDate[d] });
  });

  const W = 600, H = 220, PAD_L = 46, PAD_R = 14, PAD_T = 34, PAD_B = 30;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;

  const values = points.map(p => p.cum);
  let minV = Math.min(...values, saldoAwal);
  let maxV = Math.max(...values, saldoAwal);
  const rangePad = (maxV - minV) * 0.15 || 10;
  minV -= rangePad; maxV += rangePad;

  const xStep = points.length > 1 ? innerW / (points.length - 1) : 0;
  const xAt = (i) => PAD_L + i * xStep;
  const yAt = (v) => PAD_T + innerH - ((v - minV) / (maxV - minV)) * innerH;

  // Gridline & label sumbu Y (5 tick merata)
  const numTicks = 5;
  let gridLines = "";
  for (let t = 0; t <= numTicks; t++) {
    const val = minV + (maxV - minV) * (t / numTicks);
    const y = yAt(val);
    gridLines += `<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W - PAD_R}" y2="${y.toFixed(1)}" style="stroke:var(--line);stroke-width:1;opacity:0.5;" />`;
    gridLines += `<text x="${PAD_L - 8}" y="${(y + 3).toFixed(1)}" font-size="9" text-anchor="end" style="fill:var(--muted);font-family:inherit;">${Math.round(val)}</text>`;
  }

  const saldoY = yAt(saldoAwal);
  const linePoints = points.map((p, i) => `${xAt(i)},${yAt(p.cum)}`).join(" ");
  const areaPoints = `${xAt(0)},${PAD_T + innerH} ${linePoints} ${xAt(points.length - 1)},${PAD_T + innerH}`;

  const dots = points.map((p, i) => {
    const color = i === 0 ? "var(--muted)" : (p.dailyPL >= 0 ? "var(--good)" : "var(--danger)");
    return `<circle cx="${xAt(i)}" cy="${yAt(p.cum)}" r="4" style="fill:${color};stroke:var(--surface);stroke-width:1.5;" />`;
  }).join("");

  const maxLabels = 5;
  const labelStep = Math.max(1, Math.ceil((points.length - 1) / maxLabels));
  let xLabels = "";
  points.forEach((p, i) => {
    if (i === 0) return;
    if (i % labelStep === 0 || i === points.length - 1) {
      const d = new Date(p.date + "T00:00:00");
      const label = `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
      xLabels += `<text x="${xAt(i)}" y="${H - 8}" font-size="10" text-anchor="middle" style="fill:var(--muted);font-family:inherit;">${label}</text>`;
    }
  });

  const finalVal = points[points.length - 1].cum;
  const finalColor = finalVal >= saldoAwal ? "var(--good)" : "var(--danger)";

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <line x1="${PAD_L}" y1="${saldoY.toFixed(1)}" x2="${W - PAD_R}" y2="${saldoY.toFixed(1)}" style="stroke:var(--line);stroke-width:1.3;stroke-dasharray:4,4;" />
      <text x="${PAD_L + 6}" y="${(saldoY - 6).toFixed(1)}" font-size="9" style="fill:var(--muted);font-family:inherit;">Saldo Awal</text>
      <polygon points="${areaPoints}" style="fill:var(--good);opacity:0.08;" />
      <polyline points="${linePoints}" style="fill:none;stroke:var(--good);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;" />
      ${dots}
      ${xLabels}
      <text x="${W - PAD_R}" y="${PAD_T - 10}" font-size="21" font-weight="700" text-anchor="end" style="fill:${finalColor};font-family:inherit;">${formatMoney(finalVal)}</text>
    </svg>
  `;
}

// Statistik performa lanjutan: profit factor, rata-rata profit/loss, dan
// win/loss streak (dihitung dari trade terbaru mundur, berhenti di BE).
function computeAdvancedStats() {
  const wins = entries.filter(e => e.hasil === "profit");
  const losses = entries.filter(e => e.hasil === "loss");
  const grossProfit = wins.reduce((s, e) => s + (parseFloat(e.pl) || 0), 0);
  const grossLoss = Math.abs(losses.reduce((s, e) => s + (parseFloat(e.pl) || 0), 0));
  const profitFactor = grossLoss > 0 ? (grossProfit / grossLoss) : (grossProfit > 0 ? Infinity : 0);
  const avgWin = wins.length > 0 ? grossProfit / wins.length : 0;
  const avgLoss = losses.length > 0 ? grossLoss / losses.length : 0;

  let streak = 0, streakType = null;
  for (let i = 0; i < entries.length; i++) {
    const h = entries[i].hasil;
    if (h === "be") break;
    if (streakType === null) { streakType = h; streak = 1; }
    else if (h === streakType) { streak++; }
    else break;
  }

  return { grossProfit, grossLoss, profitFactor, avgWin, avgLoss, streak, streakType };
}

// Bar chart P/L per hari (SVG murni), dengan gridline + label sumbu X & Y.
function buildDailyPLBarChartSVG() {
  if (entries.length === 0) {
    return `<p style="font-size:13px;color:var(--muted);">Belum ada data trade untuk ditampilkan grafiknya.</p>`;
  }

  const byDate = {};
  entries.forEach(e => {
    const d = e.tanggal || "";
    if (!d) return;
    byDate[d] = (byDate[d] || 0) + (parseFloat(e.pl) || 0);
  });
  const dates = Object.keys(byDate).sort();
  const values = dates.map(d => byDate[d]);

  const W = 600, H = 210, PAD_L = 42, PAD_R = 14, PAD_T = 14, PAD_B = 30;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;

  let maxAbs = Math.max(...values.map(v => Math.abs(v)), 1) * 1.2;
  const zeroY = PAD_T + innerH / 2;
  const scale = (innerH / 2) / maxAbs;

  const barSlot = innerW / dates.length;
  const barWidth = Math.min(34, barSlot * 0.6);

  let gridLines = "";
  [maxAbs, maxAbs / 2, 0, -maxAbs / 2, -maxAbs].forEach(v => {
    const y = zeroY - v * scale;
    const isZero = v === 0;
    gridLines += `<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W - PAD_R}" y2="${y.toFixed(1)}" style="stroke:var(--line);stroke-width:${isZero ? 1.3 : 1};opacity:${isZero ? 1 : 0.5};" />`;
    gridLines += `<text x="${PAD_L - 8}" y="${(y + 3).toFixed(1)}" font-size="9" text-anchor="end" fill="var(--muted)">${Math.round(v)}</text>`;
  });

  let bars = "", xLabels = "";
  const maxLabels = 6;
  const labelStep = Math.max(1, Math.ceil(dates.length / maxLabels));
  dates.forEach((d, i) => {
    const val = byDate[d];
    const x = PAD_L + i * barSlot + (barSlot - barWidth) / 2;
    const barH = Math.max(Math.abs(val) * scale, 1);
    const y = val >= 0 ? zeroY - barH : zeroY;
    const color = val >= 0 ? "var(--good)" : "var(--danger)";
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" rx="2" />`;

    if (i % labelStep === 0 || i === dates.length - 1) {
      const dt = new Date(d + "T00:00:00");
      const label = `${String(dt.getDate()).padStart(2, "0")}/${String(dt.getMonth() + 1).padStart(2, "0")}`;
      xLabels += `<text x="${(x + barWidth / 2).toFixed(1)}" y="${H - 10}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${label}</text>`;
    }
  });

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      ${bars}
      ${xLabels}
    </svg>
  `;
}

// Breakdown performa per pair: jumlah trade, win rate, dan total P/L,
// diurutkan dari yang paling profit ke paling loss.
function buildPairBreakdownHTML() {
  if (entries.length === 0) {
    return `<p style="font-size:13px;color:var(--muted);">Belum ada data trade untuk ditampilkan.</p>`;
  }
  const byPair = {};
  entries.forEach(e => {
    const p = (e.pair || "-").toUpperCase();
    if (!byPair[p]) byPair[p] = { count: 0, wins: 0, totalPL: 0 };
    byPair[p].count++;
    if (e.hasil === "profit") byPair[p].wins++;
    byPair[p].totalPL += (parseFloat(e.pl) || 0);
  });
  const pairsSorted = Object.keys(byPair).sort((a, b) => byPair[b].totalPL - byPair[a].totalPL);

  return pairsSorted.map((p, idx) => {
    const d = byPair[p];
    const winRate = d.count > 0 ? Math.round((d.wins / d.count) * 100) : 0;
    const color = d.totalPL >= 0 ? "var(--good)" : "var(--danger)";
    const borderStyle = idx === pairsSorted.length - 1 ? "border-bottom:none;" : "border-bottom:1px solid var(--line);";
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;${borderStyle}">
      <div style="flex:1;">
        <div style="font-size:13px;font-weight:600;">${p}</div>
        <div style="font-size:10.5px;color:var(--muted);margin-top:2px;">${d.count} trade · Win rate ${winRate}%</div>
        <div style="background:var(--line);height:5px;border-radius:3px;margin-top:6px;overflow:hidden;">
          <div style="height:100%;border-radius:3px;width:${winRate}%;background:${color};"></div>
        </div>
      </div>
      <div style="text-align:right;margin-left:14px;">
        <div style="font-size:15px;font-weight:700;color:${color};">${formatMoneySigned(d.totalPL)}</div>
      </div>
    </div>`;
  }).join("");
}

function computeStats() {
  const total = entries.length;
  const wins = entries.filter(e => e.hasil === "profit").length;
  const losses = entries.filter(e => e.hasil === "loss").length;
  const winrate = total > 0 ? Math.round((wins / total) * 100) : 0;
  const totalPL = entries.reduce((sum, e) => sum + (parseFloat(e.pl) || 0), 0);
  return { total, wins, losses, winrate, totalPL };
}

// Sinkronkan Modal di kalkulator ke Total Saldo terkini (Saldo Awal + Total P/L).
// Dipanggil setiap kali entries berubah (tambah/edit/hapus/hapus semua) supaya
// kalkulator selalu pakai angka modal yang paling update, bukan angka basi.
function syncCalcModalToTotalSaldo() {
  if (typeof calcState === "undefined") return;
  calcState.modal = saldoAwal + computeStats().totalPL;
  saveJSON("calc-modal", calcState.modal);
  const modalInput = document.getElementById("c-modal");
  if (modalInput) modalInput.value = calcState.modal;
  if (typeof updateCalcResults === "function") updateCalcResults();
}

function renderJournal() {
  const el = document.getElementById("view-journal");

  const checklistOkNow = isChecklistComplete();
  let gateHtml = "";
  if (!editingId && !checklistOkNow) {
    if (checklistWarningExpanded) {
      const missingNow = getMissingChecklistItems();
      gateHtml = `⚠ Checklist Belum Lengkap - Trade baru tidak bisa disimpan sebelum semua poin berikut dicentang:
        <ul style="margin:6px 0 0;padding-left:18px;font-weight:400;line-height:1.5;">
          ${missingNow.map(item => `<li>${item}</li>`).join("")}
        </ul>`;
    } else {
      gateHtml = "⚠ Checklist Belum Lengkap!";
    }
  }

  let html = `<div class="panel" id="journal-form-panel"><h2>${editingId ? "Edit Trade" : "Catat Trade Baru"}</h2>
    <div id="checklist-gate" style="display:${gateHtml ? 'block' : 'none'};margin-bottom:14px;font-size:12.5px;font-weight:600;color:var(--danger);">${gateHtml}</div>
    <div class="grid2">
      <div class="field"><label>Tanggal</label><input type="date" id="f-tanggal" value="${journalForm.tanggal}"></div>
      <div class="field"><label>Pair</label><input type="text" id="f-pair" placeholder="XAUUSD, EURUSD..." value="${journalForm.pair}" style="text-transform:uppercase;" autocapitalize="characters"></div>
      <div class="field"><label>Arah</label>
        <select id="f-arah">
          <option value="buy" ${journalForm.arah==="buy"?"selected":""}>Buy</option>
          <option value="sell" ${journalForm.arah==="sell"?"selected":""}>Sell</option>
        </select>
      </div>
      <div class="field"><label>Lot</label><input type="number" step="0.01" id="f-lot" value="${journalForm.lot}"></div>
      <div class="field"><label>Harga Entry</label><input type="number" step="0.0001" id="f-entry" value="${journalForm.entry}"></div>
      <div class="field"><label>Stop Loss</label><input type="number" step="0.0001" id="f-sl" value="${journalForm.sl}"></div>
      <div class="field"><label>Take Profit</label><input type="number" step="0.0001" id="f-tp" value="${journalForm.tp}"></div>
      <div class="field"><label>Hasil</label>
        <select id="f-hasil">
          <option value="profit" ${journalForm.hasil==="profit"?"selected":""}>Profit</option>
          <option value="loss" ${journalForm.hasil==="loss"?"selected":""}>Loss</option>
          <option value="be" ${journalForm.hasil==="be"?"selected":""}>Break Even</option>
        </select>
      </div>
      <div class="field"><label>P/L ($)</label><input type="number" step="0.01" id="f-pl" value="${journalForm.pl}"></div>
      <div class="field"><label>Link</label><input type="text" id="f-link" placeholder="https://www.tradingview.com/x/..." value="${journalForm.link || ''}"></div>
    </div>
    <div class="field"><label>Catatan (alasan entry, pelanggaran checklist, dsb.)</label><textarea id="f-catatan">${journalForm.catatan}</textarea></div>
    <div class="btn-row" style="justify-content:flex-start;">
      <button class="btn-primary" id="btn-add-entry">${editingId ? "✓ Update Trade" : "+ Simpan Trade"}</button>
      ${editingId ? `<button class="btn-ghost" id="btn-cancel-edit">Batal</button>` : ""}
    </div>
  </div>`;

  el.innerHTML = html;

  ["tanggal","pair","arah","lot","entry","sl","tp","hasil","pl","link","catatan"].forEach(field => {
    const node = document.getElementById("f-" + field);
    if (!node) return;
    node.addEventListener("input", () => {
      if (field === "pair") {
        const pos = node.selectionStart;
        node.value = node.value.toUpperCase();
        node.setSelectionRange(pos, pos);
      }
      if (field === "pl") {
        const hasilNow = document.getElementById("f-hasil").value;
        const abs = Math.abs(parseFloat(node.value) || 0);
        if (hasilNow === "loss" && abs > 0) node.value = "-" + abs;
        else if (hasilNow === "profit" && abs > 0) node.value = String(abs);
      }
      journalForm[field] = node.value;
    });
    node.addEventListener("change", () => {
      if (field === "hasil") {
        const plNode = document.getElementById("f-pl");
        const abs = Math.abs(parseFloat(plNode.value) || 0);
        if (abs > 0) {
          if (node.value === "loss") plNode.value = "-" + abs;
          else if (node.value === "profit") plNode.value = String(abs);
        }
        journalForm.pl = plNode.value;
      }
      journalForm[field] = node.value;
    });
  });

  document.getElementById("btn-add-entry").addEventListener("click", () => {
    if (!journalForm.pair) return;
    if (!editingId && !isChecklistComplete()) {
      checklistWarningExpanded = true;
      renderJournal();
      const gate = document.getElementById("checklist-gate");
      if (gate) {
        gate.scrollIntoView({ behavior: "smooth", block: "center" });
        gate.style.outline = "2px solid var(--danger)";
        gate.style.outlineOffset = "4px";
        setTimeout(() => { gate.style.outline = "none"; }, 1200);
      }
      return;
    }
    const wasEditing = !!editingId;
    let isNewEntry = false;
    if (editingId) {
      entries = entries.map(e => e.id === editingId ? Object.assign({}, e, journalForm) : e);
      editingId = null;
    } else {
      entries.unshift(Object.assign({}, journalForm, { id: Date.now() }));
      isNewEntry = true;
    }
    saveJSON("journal-entries", entries);
    syncCalcModalToTotalSaldo();
    if (isNewEntry) {
      // Reset checklist otomatis setelah trade baru berhasil disimpan,
      // supaya wajib checklist ulang dari nol untuk trade berikutnya.
      // Pakai resetChecklist() (bukan reset manual) supaya tampilan
      // checkbox di tab Checklist ikut ter-refresh juga.
      resetChecklist();
      checklistWarningExpanded = false;
    }
    journalForm = {
      tanggal: todayLocalISO(),
      pair: "", arah: "buy", entry: "", sl: "", tp: "", lot: "",
      hasil: "profit", pl: "", link: "", catatan: ""
    };
    if (wasEditing) {
      // Trade yang diedit berasal dari tab Statistik -> kembali ke sana
      // supaya langsung terlihat hasil update-nya di Riwayat.
      showTab("statistik");
    } else {
      renderJournal();
    }
  });

  const cancelBtn = document.getElementById("btn-cancel-edit");
  if (cancelBtn) {
    cancelBtn.addEventListener("click", () => {
      editingId = null;
      journalForm = {
        tanggal: todayLocalISO(),
        pair: "", arah: "buy", entry: "", sl: "", tp: "", lot: "",
        hasil: "profit", pl: "", link: "", catatan: ""
      };
      showTab("statistik");
    });
  }
}

/* ================= STATISTIK ================= */
function renderStatistik() {
  const el = document.getElementById("view-statistik");
  const stats = computeStats();
  const adv = computeAdvancedStats();

  let html = `<div class="panel dark"><h2>Saldo</h2>

      </div>

      </div>
    </div>
    <div class="field" style="margin-top:16px;margin-bottom:0;">

    </div>
  </div>`;

  html += `<div class="panel dark"><h2>Ringkasan</h2>
    <div class="grid2" style="grid-template-columns:repeat(4,1fr);">
      <div><div class="stat-label">Total Trade</div><div class="big" style="font-size:20px;">${stats.total}</div></div>
      <div><div class="stat-label">Win Rate</div><div class="big" style="font-size:20px;">${stats.winrate}%</div></div>
      <div><div class="stat-label">Menang/Kalah</div><div class="big" style="font-size:20px;">${stats.wins}/${stats.losses}</div></div>
      <div><div class="stat-label">Total P/L</div><div class="big" style="font-size:20px;color:${stats.totalPL>=0?'var(--good)':'var(--danger)'};">${formatMoneySigned(stats.totalPL)}</div></div>
    </div>
  </div>`;

  const pfDisplay = entries.length === 0 ? "-" : (adv.profitFactor === Infinity ? "∞" : adv.profitFactor.toFixed(2));
  const streakDisplay = (entries.length === 0 || !adv.streakType) ? "-" : `${adv.streak}${adv.streakType === "profit" ? "W" : "L"}`;
  const streakColor = adv.streakType === "profit" ? "var(--good)" : (adv.streakType === "loss" ? "var(--danger)" : "var(--muted)");

  html += `<div class="panel dark"><h2>Ringkasan Performa</h2>
    <div class="grid2" style="grid-template-columns:repeat(4,1fr);">
      <div><div class="stat-label">Profit Factor</div><div class="big" style="font-size:20px;color:var(--good);">${pfDisplay}</div></div>
      <div><div class="stat-label">Win/Loss Streak</div><div class="big" style="font-size:20px;color:${streakColor};">${streakDisplay}</div></div>
      <div><div class="stat-label">Rata-rata Profit</div><div class="big" style="font-size:20px;color:var(--good);">${formatMoneySigned(adv.avgWin)}</div></div>
      <div><div class="stat-label">Rata-rata Loss</div><div class="big" style="font-size:20px;color:var(--danger);">${formatMoneySigned(-adv.avgLoss)}</div></div>
    </div>
  </div>`;

  html += `<div class="panel dark"><h2>Grafik Equity</h2>
    ${buildEquityCurveSVG()}
  </div>`;

  html += `<div class="panel dark"><h2>P/L Harian</h2>
    ${buildDailyPLBarChartSVG()}
  </div>`;

  html += `<div class="panel dark"><h2>Breakdown per Pair</h2>
    ${buildPairBreakdownHTML()}
  </div>`;

  html += `<div class="panel"><h2>Riwayat (${entries.length})</h2>`;
  if (entries.length > 0) {
    html += `<div class="btn-row" style="justify-content:flex-start;margin-bottom:14px;">
      <button class="btn-danger-ghost" id="btn-clear-journal">🗑 Hapus Semua Riwayat</button>
    </div>`;
  }
  if (entries.length === 0) {
    html += `<p style="font-size:13px;color:var(--muted);">Belum ada trade tercatat.</p>`;
  } else {
    entries.forEach(e => {
      const resultColor = e.hasil === "profit" ? "var(--good)" : e.hasil === "loss" ? "var(--danger)" : "var(--muted)";
      const resultLabel = e.hasil === "profit" ? "Profit" : e.hasil === "loss" ? "Loss" : "BE";
      const arrow = e.arah === "buy"
        ? `<span style="color:#2f6fd1;">▲ Buy</span>`
        : `<span style="color:var(--danger);">▼ Sell</span>`;
      const linkUrl = e.link ? (e.link.startsWith('http://') || e.link.startsWith('https://') ? e.link : 'https://' + e.link) : '';
      const linkHtml = linkUrl ? `<a href="${linkUrl}" target="_blank" rel="noopener noreferrer" class="entry-link">🔗 Chart TradingView</a>` : '';

      html += `<div class="entry-card">
        <div class="entry-top">
          <div>
            <div class="entry-title">${arrow} ${e.pair || "-"} · ${e.lot || "0"} lot <span style="font-size:11px;color:var(--muted);font-weight:400;">${e.tanggal}</span></div>
            <div class="entry-meta">Entry ${e.entry || "-"} · SL ${e.sl || "-"} · TP ${e.tp || "-"}</div>
            ${e.catatan ? `<div class="entry-note" style="margin-top:5px;">${e.catatan}</div>` : ""}
            ${linkHtml}
          </div>
          <div class="entry-result">
            <div style="color:${resultColor};">${resultLabel}${e.pl ? ` (${formatMoneySigned(e.pl)})` : ""}</div>
            <button class="entry-edit" data-id="${e.id}">✏️ Edit</button>
            <button class="entry-del" data-id="${e.id}">🗑 Hapus</button>
          </div>
        </div>
      </div>`;
    });
  }
  html += `</div>`;

  el.innerHTML = html;

  document.getElementById("f-currency-unit").addEventListener("change", (e) => {
    currencyUnit = e.target.value;
    saveJSON("currency-unit", currencyUnit);
    renderStatistik();
  });

  document.getElementById("f-saldo-awal").addEventListener("input", (e) => {
    saldoAwal = parseFloat(e.target.value) || 0;
    saveJSON("saldo-awal", saldoAwal);

    const totalSaldo = saldoAwal + computeStats().totalPL;

    calcState.modal = totalSaldo;
    saveJSON("calc-modal", calcState.modal);

    const displayEl = document.getElementById("total-saldo-display");
    if (displayEl) {
      displayEl.textContent = formatMoney(totalSaldo);
      displayEl.style.color = totalSaldo >= 0 ? "var(--good)" : "var(--danger)";
    }

    const cModalInput = document.getElementById("c-modal");
    if (cModalInput) {
      cModalInput.value = calcState.modal;
    }
    updateCalcResults();
  });

  el.querySelectorAll(".entry-edit").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = parseInt(btn.dataset.id, 10);
      const target = entries.find(e => e.id === id);
      if (!target) return;
      editingId = id;
      journalForm = {
        tanggal: target.tanggal, pair: target.pair, arah: target.arah,
        entry: target.entry, sl: target.sl, tp: target.tp, lot: target.lot,
        hasil: target.hasil, pl: target.pl, link: target.link || "", catatan: target.catatan
      };
      showTab("journal");
      setTimeout(() => {
        const panel = document.getElementById("journal-form-panel");
        if (panel) panel.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 60);
    });
  });

  el.querySelectorAll(".entry-del").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = parseInt(btn.dataset.id, 10);
      entries = entries.filter(e => e.id !== id);
      if (editingId === id) editingId = null;
      saveJSON("journal-entries", entries);
      syncCalcModalToTotalSaldo();
      renderStatistik();
    });
  });

  const clearBtn = document.getElementById("btn-clear-journal");
  if (clearBtn) {
    clearBtn.addEventListener("click", () => {
      if (confirm("Hapus semua riwayat jurnal? Tindakan ini tidak bisa dibatalkan.")) {
        entries = [];
        saveJSON("journal-entries", entries);
        syncCalcModalToTotalSaldo();
        renderStatistik();
      }
    });
  }
}


/* ================= CALCULATOR ================= */
const savedCalcModal = loadJSON("calc-modal", null);
const savedCalcSl = loadJSON("calc-sl", null);
const savedCalcPair = loadJSON("calc-pair", "xauusd");
const savedCalcRiskPct = loadJSON("calc-risk-pct", 1);
const savedCalcUnit = UNIT_MAP[savedCalcPair];
const initialTotalSaldo = saldoAwal + computeStats().totalPL;

let calcState = { 
  modal: (initialTotalSaldo > 0) ? initialTotalSaldo : (savedCalcModal !== null ? savedCalcModal : 1000), 
  pair: savedCalcPair, 
  riskPct: savedCalcRiskPct, 
  slUnit: savedCalcUnit, 
  sl: (savedCalcSl !== null) ? savedCalcSl : DEFAULT_SL_MAP[savedCalcPair][savedCalcUnit]
};

function getSlHint(pair, unit) {
  if (unit === 'dollar') {
    if (pair === 'xauusd') return '💡 Contoh: 5 (artinya $5.00 pergerakan harga Gold)';
    if (pair === 'btcusd') return '💡 Contoh: 500 (artinya $500.00 pergerakan harga Bitcoin)';
  }
  if (unit === 'pips') {
    return '💡 Contoh: 30 pips (standar universal untuk Forex, 1 pip = 0.0001)';
  }
  return '';
}

function updateCalcResults() {
  const riskAmount = calcState.modal * (calcState.riskPct / 100);
  let lot = 0;
  let pipValThisLot = 0;
  let pipValLabel = "Nilai per $1 pergerakan";

  const sl = calcState.sl;
  const unit = calcState.slUnit || "dollar";
  const pair = calcState.pair;

  if (sl > 0) {
    if (pair === "xauusd") {
      if (unit === "dollar") {
        lot = riskAmount / (sl * 100);
        pipValThisLot = 100 * lot;
        pipValLabel = "Nilai per $1.00 pergerakan";
      } else if (unit === "pips") {
        lot = riskAmount / (sl * 10);
        pipValThisLot = 10 * lot;
        pipValLabel = "Nilai per 1 pip ($0.10)";
      } else { // points
        lot = riskAmount / (sl * 1);
        pipValThisLot = 1 * lot;
        pipValLabel = "Nilai per 1 poin ($0.01)";
      }
    } else if (pair === "btcusd") {
      if (unit === "dollar") {
        lot = riskAmount / (sl * 1);
        pipValThisLot = 1 * lot;
        pipValLabel = "Nilai per $1.00 pergerakan";
      } else if (unit === "pips") {
        lot = riskAmount / (sl * 1);
        pipValThisLot = 1 * lot;
        pipValLabel = "Nilai per 1 pip ($1.00)";
      } else { // points
        lot = riskAmount / (sl * 0.1);
        pipValThisLot = 0.1 * lot;
        pipValLabel = "Nilai per 1 poin ($0.10)";
      }
    } else if (pair === "forex") {
      // PERBAIKAN: dulu ada "sl >= 1 ? sl/10000 : sl" yang menebak-nebak
      // satuan berdasarkan besar angka -> menyebabkan lompatan lot ekstrem
      // di sekitar sl=1. Sekarang "dollar" selalu diperlakukan sebagai
      // nilai desimal harga apa adanya, konsisten untuk semua nilai.
      if (unit === "dollar") {
        lot = riskAmount / (sl * 100000);
        pipValThisLot = 10 * lot;
        pipValLabel = "Nilai per 1 pip (0.0001)";
      } else if (unit === "pips") {
        lot = riskAmount / (sl * 10);
        pipValThisLot = 10 * lot;
        pipValLabel = "Nilai per 1 pip";
      } else { // points
        lot = riskAmount / (sl * 1);
        pipValThisLot = 1 * lot;
        pipValLabel = "Nilai per 1 poin";
      }
    }
  }

  const belowMin = lot > 0 && lot < 0.01;

  const lotEl = document.getElementById("calc-lot-display");
  const riskEl = document.getElementById("calc-risk-display");
  const pipValEl = document.getElementById("calc-pipval-display");
  const pipValLabelEl = document.getElementById("calc-pipval-label");
  const warnEl = document.getElementById("calc-warn");

  if (lotEl) lotEl.innerHTML = `${lot.toFixed(3)} <span>lot</span>`;
  if (riskEl) riskEl.textContent = formatMoney(riskAmount);
  if (pipValEl) pipValEl.textContent = formatMoney(pipValThisLot);
  if (pipValLabelEl) pipValLabelEl.textContent = pipValLabel;
  if (warnEl) warnEl.classList.toggle("show", belowMin);
}

function renderCalculator() {
  const el = document.getElementById("view-calculator");
  const currentTotalSaldo = saldoAwal + computeStats().totalPL;

  let html = `<div class="panel"><h2>Modal &amp; Instrumen</h2>
    <div class="field">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <label style="margin-bottom:0;">Modal (${currencySymbol()})</label>
        ${currentTotalSaldo > 0 ? `<button type="button" id="btn-sync-saldo" style="background:none;border:none;color:var(--accent2);font-size:11px;cursor:pointer;padding:0;text-decoration:underline;">↺ Pakai Total Saldo (${formatMoney(currentTotalSaldo)})</button>` : ''}
      </div>
      <input type="number" id="c-modal" value="${calcState.modal}">
    </div>
    <div class="field"><label>Pasangan / Instrumen</label>
      <div class="toggle">
        <button data-pair="xauusd" class="${calcState.pair==='xauusd'?'active':''}">XAUUSD (Gold)</button>
        <button data-pair="btcusd" class="${calcState.pair==='btcusd'?'active':''}">BTCUSD</button>
        <button data-pair="forex" class="${calcState.pair==='forex'?'active':''}">Forex Major</button>
      </div>
    </div>
  </div>`;

  html += `<div class="panel"><h2>Risk per Trade</h2>
    <div class="field"><label>Persentase risk</label>
      <div class="risk-row">
        ${[0.5,1,1.5,2].map(r => `<button data-risk="${r}" class="${calcState.riskPct===r?'active':''}">${r}%</button>`).join("")}
      </div>
    </div>
    <div class="field">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <label style="margin-bottom:0;">Jarak SL</label>
        <span style="font-size:11px;font-weight:600;color:var(--accent2);background:rgba(31,122,77,0.12);padding:3px 8px;border-radius:10px;">
          🔒 Satuan: ${calcState.slUnit === 'dollar' ? 'Dollar ($)' : 'Pips'} — otomatis
        </span>
      </div>
      <input type="number" id="c-sl" value="${calcState.sl}" step="any">
      <div style="font-size:11px;color:var(--muted);margin-top:4px;" id="c-sl-hint">
        ${getSlHint(calcState.pair, calcState.slUnit)}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;font-style:italic;">
        Satuan mengikuti instrumen yang dipilih secara otomatis, supaya tidak ada risiko salah pilih satuan yang berakibat fatal ke perhitungan lot.
      </div>
    </div>
  </div>`;

  html += `<div class="panel dark"><h2>Hasil</h2>
    <div class="stat-label">Lot size yang dipakai</div>
    <div class="big" id="calc-lot-display">0.000 <span>lot</span></div>
    <div class="grid2" style="margin-top:16px;">
      <div><div class="stat-label">Risk amount</div><div class="stat-val" id="calc-risk-display">$0.00</div></div>
      <div><div class="stat-label" id="calc-pipval-label">Nilai per $1 pergerakan</div><div class="stat-val" id="calc-pipval-display">$0.00</div></div>
    </div>
    <div class="warn" id="calc-warn">Lot di bawah minimum umum broker (0.01). Perbesar % risk atau cari setup dengan SL lebih sempit.</div>
  </div>`;

  html += `<p class="note-text">Rumus XAUUSD: Lot = Risk ÷ (Jarak SL $ × $100/lot). Rumus BTCUSD: Lot = Risk ÷ (Jarak SL $ × $1/lot, asumsi 1 lot = 1 BTC). Rumus Forex: Lot = Risk ÷ (Jarak SL $ × $100.000/lot). Cek Contract Specification broker kamu — nilai kontrak bisa berbeda antar broker.</p>`;

  el.innerHTML = html;

  const syncBtn = document.getElementById("btn-sync-saldo");
  if (syncBtn) {
    syncBtn.addEventListener("click", () => {
      calcState.modal = saldoAwal + computeStats().totalPL;
      saveJSON("calc-modal", calcState.modal);
      const modalInput = document.getElementById("c-modal");
      if (modalInput) modalInput.value = calcState.modal;
      updateCalcResults();
    });
  }

  document.getElementById("c-modal").addEventListener("input", (e) => {
    calcState.modal = parseFloat(e.target.value) || 0;
    saveJSON("calc-modal", calcState.modal);
    updateCalcResults();
  });

  document.getElementById("c-sl").addEventListener("input", (e) => {
    calcState.sl = parseFloat(e.target.value) || 0;
    saveJSON("calc-sl", calcState.sl);
    updateCalcResults();
  });

  // Event listener saat berpindah Instrumen/Pair -> Satuan SL otomatis mengikuti UNIT_MAP,
  // nilai SL direset ke default yang sesuai untuk satuan tersebut.
  el.querySelectorAll("[data-pair]").forEach(btn => {
    btn.addEventListener("click", () => {
      const newPair = btn.dataset.pair;
      if (newPair !== calcState.pair) {
        calcState.pair = newPair;
        calcState.slUnit = UNIT_MAP[newPair];
        calcState.sl = DEFAULT_SL_MAP[newPair][calcState.slUnit];
        saveJSON("calc-pair", newPair);
        saveJSON("calc-sl", calcState.sl);
        renderCalculator();
      }
    });
  });

  el.querySelectorAll("[data-risk]").forEach(btn => {
    btn.addEventListener("click", () => {
      calcState.riskPct = parseFloat(btn.dataset.risk);
      saveJSON("calc-risk-pct", calcState.riskPct);
      renderCalculator();
    });
  });

  updateCalcResults();
}

/* ---------- THEME TOGGLE ---------- */
function applyTheme(mode) {
  const btn = document.getElementById("theme-toggle");
  if (mode === "dark") {
    document.body.classList.add("theme-dark");
    btn.textContent = "☀";
  } else {
    document.body.classList.remove("theme-dark");
    btn.textContent = "🌙";
  }
  // Set eksplisit di <html> (bukan cuma lewat CSS class di body) supaya
  // dropdown native (<select>, date picker, dsb) ikut warna tema di
  // Chromium/Android — sebagian browser cuma baca color-scheme dari root.
  document.documentElement.style.colorScheme = mode === "dark" ? "dark" : "light";
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute("content", mode === "dark" ? "#10161d" : "#1b2430");
}

let themePref = "light";
try {
  themePref = localStorage.getItem("theme-pref") || "light";
} catch (e) {}
applyTheme(themePref);

document.getElementById("theme-toggle").addEventListener("click", () => {
  themePref = themePref === "dark" ? "light" : "dark";
  try { localStorage.setItem("theme-pref", themePref); } catch (e) {}
  applyTheme(themePref);
});

/* ---------- SWIPE KIRI/KANAN UNTUK PINDAH TAB ---------- */
// Usap ke kiri = pindah ke tab berikutnya, usap ke kanan = tab sebelumnya.
// Sengaja TIDAK mengecualikan elemen awal sentuhan (input/tombol/dsb) —
// ketukan biasa (tap) hampir tidak ada pergeseran jarak, jadi otomatis
// tidak lolos ambang batas jarak di bawah. Ini supaya swipe tetap berfungsi
// walau dimulai tepat di atas tombol/kolom yang bisa diklik.
let swipeStartX = 0, swipeStartY = 0;

document.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1) return;
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener("touchend", (e) => {
  if (e.changedTouches.length !== 1) return;

  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);

  const SWIPE_MIN_DISTANCE = 35;
  if (absDx < SWIPE_MIN_DISTANCE || absDx < absDy * 1.1) return;

  const idx = tabs.indexOf(currentTab);
  if (dx < 0 && idx < tabs.length - 1) {
    showTab(tabs[idx + 1]); // usap kiri -> tab berikutnya
  } else if (dx > 0 && idx > 0) {
    showTab(tabs[idx - 1]); // usap kanan -> tab sebelumnya
  }
}, { passive: true });

/* ---------- HINDARI FIELD KETUTUP KEYBOARD ---------- */
// Setiap kali input/select/textarea di-fokus, scroll otomatis ke tengah layar
// yang masih terlihat. Pakai event delegation supaya berlaku juga untuk field
// yang di-render ulang (form journal, kalkulator, dsb).
function scrollFocusedFieldIntoView(el) {
  if (!el) return;
  const tag = el.tagName;
  if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") return;
  setTimeout(() => {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
  }, 300);
}

document.addEventListener("focusin", (e) => {
  scrollFocusedFieldIntoView(e.target);
});

// Saat pindah dari kolom teks/angka (yang butuh keyboard) ke dropdown (select,
// yang pakai picker native, bukan keyboard), kadang keyboard software Android
// tertinggal terbuka sesaat. Trik blur+refocus ini memaksa keyboard menutup
// dengan benar sebelum picker dropdown-nya muncul.
document.addEventListener("focusout", (e) => {
  const leavingField = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA";
  if (!leavingField) return;
  setTimeout(() => {
    const next = document.activeElement;
    if (next && next.tagName === "SELECT") {
      next.blur();
      setTimeout(() => next.focus(), 30);
    }
  }, 50);
});

// Reaksi lebih presisi: begitu keyboard software BENAR-BENAR muncul (area
// layar menyusut signifikan), posisikan ulang field yang sedang aktif.
// PENTING: scroll biasa di HP juga memicu event ini (address bar browser
// collapse/muncul saat scroll) — makanya kita cek dulu penyusutannya cukup
// besar (>150px, ciri khas keyboard) supaya tidak salah trigger saat scroll.
//
// Bottom nav dipantau TERUS-MENERUS (bukan cuma sekali saat keyboard
// muncul) supaya presisi menempel di tepi bawah area yang BENAR-BENAR
// terlihat — termasuk saat kamu scroll sambil keyboard masih terbuka
// (posisi area terlihat bisa bergeser saat itu, dan position:fixed biasa
// tidak otomatis mengikuti pergeseran itu di banyak browser Android).
function positionTabsAboveKeyboard() {
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  const offsetFromBottom = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
  const tabsEl = document.querySelector(".tabs");
  if (tabsEl) tabsEl.style.bottom = offsetFromBottom + "px";
  const fabExport = document.getElementById("fab-export-journal");
  const fabReset = document.getElementById("fab-reset-checklist");
  const fabBottom = (offsetFromBottom > 0 ? offsetFromBottom + 82 : 82) + "px";
  if (fabExport) fabExport.style.bottom = fabBottom;
  if (fabReset) fabReset.style.bottom = fabBottom;
}

if (window.visualViewport) {
  let lastViewportHeight = window.visualViewport.height;

  window.visualViewport.addEventListener("resize", () => {
    const newHeight = window.visualViewport.height;
    const shrunk = lastViewportHeight - newHeight;
    lastViewportHeight = newHeight;
    if (shrunk > 150) {
      scrollFocusedFieldIntoView(document.activeElement);
    }
    positionTabsAboveKeyboard();
  });

  // Dengarkan juga event scroll KHUSUS milik visualViewport (bukan window) —
  // ini yang menangkap pergeseran saat kamu scroll ketika keyboard terbuka.
  window.visualViewport.addEventListener("scroll", positionTabsAboveKeyboard);
}

positionTabsAboveKeyboard();

/* ---------- INIT ---------- */
renderChecklist();
renderJournal();
renderCalculator();
showTab("statistik");

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch((e) => console.warn("SW register failed", e));
  });
}
